name: Refresh Woot products
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/woot.py
        env:
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
      - name: Save if changed
        run: |
          git config user.name "Bash's Bargains"
          git config user.email "BashsBargains@gmail.com"
          git add woot/woot.json
          git diff --cached --quiet || (git commit -m "Woot products refresh" && git pull --rebase -q && git push)
